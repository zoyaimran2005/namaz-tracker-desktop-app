<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Namaz Tracker</title>
    <link rel="stylesheet" href="styles.css" />
  </head>

  <body>
   <div class="app">
    <div class="header"> REMINDER </div>
    <div class="reminder">
      <!-- Reminder Banner / Card -->
    <div class="reminder-card">
        <img src="assets/bell_icon-removebg-preview.png" class="bell-img">
        <h2 id="prayer-name">Fajr Time</h2>
        <p id="prayer-time">04:05 AM</p>
        <span class="reminder-message">It is time to pray!</span>
      </div>
  
      <!-- Action Buttons -->
      <div class="reminder-actions" style="display:flex; gap:5px;">
        <button type="button" class="action-btn pray-btn" id="mark-prayed-btn" style="width:100px">
          Prayed
        </button>
        
        <a href="index.html" class="back-link">
          <button type="button" class="action-btn dismiss-btn" style="width:100px">Dismiss</button>
        </a>
      </div>
     
    </div>
   </div>

    <script src="script.js"></script>
  </body>
</html>
