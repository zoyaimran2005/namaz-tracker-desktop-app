<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tracker</title>
    <link rel="stylesheet" href="styles.css" />

</head>
<body>
    <div class="app" >
    
        <!-- Top Header -->
        <div class="header">
         Namaz Timings
        </div>  
      <!-- 5 Prayers List -->
      <div class="prayer-list" style="height:200px; font-size: larger; letter-spacing: 2px;">
        
        <div class="prayer-item">
          <span class="prayer-name" style="margin-right: 20px;">Fajr</span>
          <span id="fajr-time">4:05 am</span>
        </div>
  
        <div class="prayer-item">
          <span class="prayer-name" style="margin-right: 20px;">Dhuhr</span>
          <span id="dhuhr-time">1 pm</span>
        </div>
  
        <div class="prayer-item">
          <span class="prayer-name" style="margin-right: 20px;">Asr</span>
          <span id="asr-time">5 pm</span>
        </div>
  
        <div class="prayer-item">
          <span class="prayer-name" style="margin-right: 10px;">Maghrib</span>
          <span id="maghrib">6:30 pm</span>
        </div>
  
        <div class="prayer-item">
          <span class="prayer-name" style="margin-right: 20px;">Isha</span>
          <span id="isha-time">8 pm</span>
        </div>
  
      </div>
  
      <div class="buttons" style="display:flex; gap:5px">
      <a href="index.html" class="back-link" >
        <button type="submit" class="back-btn" style="width: 100px">← Back</button>
      </a>

      </div>
</div>
   <script src="script.js"></script>
</body>
</html>
